  .workload-card.jina .task-count { color: var(--jina); }
  .workload-card.zoey .task-count { color: var(--zoey); }

// ─── 수동 업무 로드/저장 ────────────────────────────
const STORAGE_KEY = '26fw_manual_tasks';
let manualTasks = [];
try { manualTasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}

function saveManual() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(manualTasks));
}

// ─── 필터 상태 ──────────────────────────────────────
let filterPerson = 'all';
let filterOverdue = false;
let filterAsanaOnly = false;
let sortKey = 'dueDate';
let sortAsc = true;

function setFilter(p, btn) {
  filterPerson = p;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function setStatusFilter(s) {
  filterOverdue = !filterOverdue;
  const btn = document.getElementById('btn-overdue-filter');
  btn.classList.toggle('active', filterOverdue);
  renderTable();
}

function toggleSourceFilter() {
  filterAsanaOnly = !filterAsanaOnly;
  const btn = document.getElementById('btn-asana-only');
  btn.classList.toggle('active', filterAsanaOnly);
  renderTable();
}

function sortBy(key) {
  if (sortKey === key) sortAsc = !sortAsc;
  else { sortKey = key; sortAsc = true; }
  renderTable();
}

// ─── 렌더링 ────────────────────────────────────────
function allTasks() {
  const manual = manualTasks.map(t => ({ ...t, source: 'manual' }));
  return [...ASANA_TASKS.map(t => ({ ...t, source: 'asana' })), ...manual];
}

function renderStats() {
  const tasks = allTasks();
  document.getElementById('stat-total').textContent = tasks.length;
  document.getElementById('stat-overdue').textContent = tasks.filter(t => getStatus(t.dueDate, t.completed) === 'overdue').length;
  document.getElementById('stat-soon').textContent = tasks.filter(t => ['today','soon'].includes(getStatus(t.dueDate, t.completed))).length;
  document.getElementById('stat-upcoming').textContent = tasks.filter(t => getStatus(t.dueDate, t.completed) === 'upcoming').length;
  document.getElementById('stat-asana').textContent = tasks.filter(t => t.source === 'asana').length;
  document.getElementById('stat-manual').textContent = tasks.filter(t => t.source === 'manual').length;
}

function renderWorkload() {
  const tasks = allTasks();
  const members = [
    { cls:'jooyeon', name:'주연', role:'파트 리드' },
    { cls:'jina',    name:'진아', role:'콘텐츠 에디터' },
    { cls:'zoey',    name:'유진', role:'콘텐츠 에디터' },
    { cls:'eunji',   name:'은지', role:'콘텐츠 에디터' },
    { cls:'kay',     name:'경진(Kay)', role:'콘텐츠 에디터' },
  ];
  const maxCount = Math.max(...members.map(m => tasks.filter(t => t.assignee === m.name).length)) || 1;
  const grid = document.getElementById('workload-grid');
  grid.innerHTML = members.map(m => {
    const mt = tasks.filter(t => t.assignee === m.name);
    const overdue = mt.filter(t => getStatus(t.dueDate, t.completed) === 'overdue').length;
    const pct = Math.round((mt.length / maxCount) * 100);
    return `<div class="workload-card ${m.cls}">
      <div class="person-name">${m.name}</div>
      <div class="task-count">${mt.length}</div>
      <div class="task-sub">${m.role} &nbsp;·&nbsp; 마감 초과 <strong style="color:var(--overdue)">${overdue}</strong>건</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function renderTable() {
  const search = document.getElementById('search-input').value.toLowerCase();
  let tasks = allTasks();

  if (filterPerson !== 'all') {
    const nameMap = { jooyeon:'주연', jina:'진아', zoey:'유진', eunji:'은지', kay:'경진(Kay)' };
    tasks = tasks.filter(t => t.assignee === nameMap[filterPerson]);
  }
  if (filterOverdue) tasks = tasks.filter(t => getStatus(t.dueDate, t.completed) === 'overdue');
  if (filterAsanaOnly) tasks = tasks.filter(t => t.source === 'asana');
  if (search) tasks = tasks.filter(t => t.name.toLowerCase().includes(search) || (t.section||'').toLowerCase().includes(search));

  tasks.sort((a, b) => {
    let va = a[sortKey] || '', vb = b[sortKey] || '';
    if (sortKey === 'status') { va = getStatus(a.dueDate, a.completed); vb = getStatus(b.dueDate, b.completed); }
    const r = va < vb ? -1 : va > vb ? 1 : 0;
    return sortAsc ? r : -r;
  });

  const tbody = document.getElementById('task-tbody');
  const noRes = document.getElementById('no-results');

  if (!tasks.length) {
    tbody.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  tbody.innerHTML = tasks.map(t => {
    const st = getStatus(t.dueDate, t.completed);
    const diff = dateDiff(t.dueDate);
    const diffStr = diff === null ? '' : diff < 0 ? `(${Math.abs(diff)}일 초과)` : diff === 0 ? '(오늘)' : `(D-${diff})`;
    const isManual = t.source === 'manual';
    const deleteBtn = isManual ? `<button class="action-btn" onclick="deleteManual('${t.id}')" title="삭제">✕</button>` : '';
    return `<tr>
      <td><span class="assignee-badge ${t.cls}">${t.assignee}</span></td>
      <td class="task-name">${t.name}${t.note ? `<div style="font-size:11px;color:var(--muted);margin-top:2px;">${t.note}</div>` : ''}</td>
      <td class="section-tag">${t.section || '—'}</td>
      <td class="due-date">${fmtDate(t.dueDate)} <span style="font-size:11px;color:var(--muted)">${diffStr}</span></td>
      <td><span class="status-badge ${st}">${statusLabel(st)}</span></td>
      <td><span class="source-badge ${isManual ? 'manual' : ''}">${isManual ? '수동 입력' : 'Asana'}</span></td>
      <td>${deleteBtn}</td>
    </tr>`;
  }).join('');
}

// ─── 수동 업무 추가 ─────────────────────────────────
function addManualTask() {
  const assigneeRaw = document.getElementById('f-assignee').value;
  const name = document.getElementById('f-name').value.trim();
  if (!assigneeRaw || !name) { alert('담당자와 업무명은 필수입니다.'); return; }

  const [cls, assignee] = assigneeRaw.split('|');
  const task = {
    id: 'm' + Date.now(),
    assignee, cls,
    name,
    section: document.getElementById('f-section').value.trim(),
    dueDate: document.getElementById('f-due').value || null,
    note: document.getElementById('f-note').value.trim(),
    completed: false,
    source: 'manual',
  };
  manualTasks.push(task);
  saveManual();
  ['f-assignee','f-name','f-section','f-due','f-note'].forEach(id => { document.getElementById(id).value = ''; });
  renderAll();
}

function deleteManual(id) {
  if (!confirm('이 업무를 삭제할까요?')) return;
  manualTasks = manualTasks.filter(t => t.id !== id);
  saveManual();
  renderAll();
}

function renderAll() {
  renderStats();
  renderWorkload();
  renderTable();
}
